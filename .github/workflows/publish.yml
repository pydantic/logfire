name: Publish Python packages

on:
  push:
    tags:
      - "**"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      checks: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.1"
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Check tag matches logfire version
        uses: samuelcolvin/check-python-version@ee87cddb8049d2694cc03badc8569765a05cef00  # v5
        with:
          version_file_path: pyproject.toml

      - name: Check tag matches logfire-api version
        uses: samuelcolvin/check-python-version@ee87cddb8049d2694cc03badc8569765a05cef00  # v5
        with:
          version_file_path: logfire-api/pyproject.toml

      - name: Check tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .name == "check" and .conclusion == "success")] | length')" -gt 0

      - name: Build packages
        run: uv build --all

      - name: Upload packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.1"
          enable-cache: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: package-distributions
          path: dist/

      - name: Publish packages to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple
