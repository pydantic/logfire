name: Feature flag mutation tests

on:
  pull_request:
    paths:
      - ".github/workflows/feature-flag-mutation.yml"
      - "logfire/__init__.py"
      - "logfire/_internal/main.py"
      - "logfire/experimental/feature_flags.py"
      - "logfire/variables/**"
      - "tests/test_feature_flags.py"
      - "tests/test_variables.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feature-flag-mutation.yml"
      - "logfire/__init__.py"
      - "logfire/_internal/main.py"
      - "logfire/experimental/feature_flags.py"
      - "logfire/variables/**"
      - "tests/test_feature_flags.py"
      - "tests/test_variables.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: feature-flag-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.1"
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts or use sensitive permissions

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen

      - name: Kill feature flag mutants
        run: make test-feature-flags-mutation
